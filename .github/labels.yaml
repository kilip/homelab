# Semantic & Conventional Types
- name: "type/feat"
  color: "0E8A16"
  description: "New feature or capability"
- name: "type/fix"
  color: "D93F0B"
  description: "Bug fix"
- name: "type/refactor"
  color: "1D76DB"
  description: "Code refactoring without behavioral change"
- name: "type/perf"
  color: "FBCA04"
  description: "Performance improvements"
- name: "type/test"
  color: "0052CC"
  description: "Adding or fixing tests"
- name: "type/docs"
  color: "0075CA"
  description: "Documentation updates"
- name: "type/build"
  color: "BFD4F2"
  description: "Changes that affect the build system or external dependencies"
- name: "type/ci"
  color: "C5DEF5"
  description: "Changes to CI configuration files and scripts"
- name: "type/chore"
  color: "7057FF"
  description: "Maintenance or tooling tasks"
- name: "type/revert"
  color: "E99695"
  description: "Reverts a previous commit"

# Semantic Types (from reference)
- name: "type/digest"
  color: "FFEC19"
  description: "Container digest or dependency hash updates"
- name: "type/patch"
  color: "FFEC19"
