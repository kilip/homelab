---
name: Molecule CI

on:
  push:
    branches:
      - main
    paths:
      - "ansible/**"
      - ".just/ansible.just"
      - ".justfile"
      - ".mise.toml"
      - ".github/workflows/molecule.yml"
  pull_request:
    paths:
      - "ansible/**"
      - ".just/ansible.just"
      - ".justfile"
      - ".mise.toml"
      - ".github/workflows/molecule.yml"

permissions:
  contents: read

jobs:
  lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - name: Install Ansible dependencies
        run: |
          mise use -g just@1.59.0
          mise exec -- uv pip install -r ansible/requirements.txt

      - name: Run ansible-lint
        run: mise exec -- just ansible::lint

  molecule:
    name: Molecule (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu
          - debian12
          - cachyos
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - name: Install Ansible dependencies
        run: |
          mise use -g just@1.59.0
          mise exec -- uv pip install -r ansible/requirements.txt

      - name: Run Molecule test
        run: mise exec -- just ansible::test "${{ matrix.platform }}"
