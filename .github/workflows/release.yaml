---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * 0"

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-26.04
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Determine Next Tag
        id: determine-next-tag
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { data: tags } = await github.rest.repos.listTags({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 1,
            });

            if (tags.length > 0 && tags[0].commit.sha === context.sha) {
              core.info(`HEAD commit ${context.sha} already tagged as ${tags[0].name}. Skipping release.`);
              core.setOutput('skip', 'true');
              return;
            }

            const rawPrevTag = tags[0]?.name || "0.0.0";
            const cleanPrevTag = rawPrevTag.replace(/^v/, '');
            const [prevMajor, prevMinor, prevPatch] = cleanPrevTag.split('.').map(Number);
            const now = new Date();
            const nextMajorMinor = `${now.getFullYear()}.${now.getMonth() + 1}`;
            const nextPatch = `${prevMajor}.${prevMinor}` === nextMajorMinor ? (prevPatch || 0) + 1 : 0;
            const nextTag = `${nextMajorMinor}.${nextPatch}`;

            console.log(`Previous tag: ${rawPrevTag}`);
            console.log(`Next tag: ${nextTag}`);

            core.setOutput('tag', nextTag);
            core.setOutput('skip', 'false');

      - name: Create Tag
        if: steps.determine-next-tag.outputs.skip != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG_NAME: ${{ steps.determine-next-tag.outputs.tag }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const tagName = process.env.TAG_NAME;

            const tag = await github.rest.git.createTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: tagName,
              message: tagName,
              object: context.sha,
              type: "commit"
            });

            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tagName}`,
              sha: tag.data.sha
            });

      - name: Create Release
        if: steps.determine-next-tag.outputs.skip != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG_NAME: ${{ steps.determine-next-tag.outputs.tag }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const tagName = process.env.TAG_NAME;

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tagName,
              name: tagName,
              generate_release_notes: true,
              target_commitish: context.sha
            });
