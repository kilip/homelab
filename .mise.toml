[tools]
# IaC & Secrets
sops = "3.13.3"
age = "1.3.2"
infisical = { version = "latest", asset_pattern = "cli_{{ version }}_{{ os(macos='darwin') }}_{{ arch(x64='amd64') }}.tar.gz" }

# Kubernetes, Cluster & GitOps
kubectl = "1.37.2"
kustomize = "5.8.3"
flux2 = "2.10.0"
helm = "4.3.2"
helmfile = "1.8.4"
kubeconform = "0.8.0"

# Networking
cloudflared = "2026.11.0"

# Runtime & Package Managers
python = "3.14"
uv = "0.13.8"
node = "26.13.1"

# Utilities & Linters
just = "1.59.0"
gh = "2.104.0"
yq = "4.54.3"
jq = "1.8.2"
gum = "2.0.2"
lefthook = "2.2.2"
gitleaks = "8.30.1"
zizmor = "1.32.0"
"github:postfinance/topf" = "0.6.2"
shellcheck = "0.11.0"
taplo = "0.10.0"
oxfmt = "0.75.0"

[env]
ANSIBLE_SOPS_AGE_KEYFILE = "{{config_root}}/age.key"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
KUBECONFIG = "{{config_root}}/kubeconfig"
_.python.venv = { path = ".venv", create = true }
