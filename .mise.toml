[tools]
# IaC & Secrets
sops = "3.13.3"
age = "1.3.2"

# Kubernetes, Cluster & GitOps
kubectl = "1.37.2"
kustomize = "5.8.3"
flux2 = "2.10.0"
helm = "4.3.1"
helmfile = "1.8.2"
kubeconform = "0.8.0"

# Networking
cloudflared = "2026.10.5"

# Runtime & Package Managers
python = "3.14"
uv = "0.13.6"
node = "26.13.0"

# Utilities & Linters
just = "1.59.0"
gh = "2.103.3"
yq = "4.54.1"
jq = "1.8.2"
gum = "2.0.2"
lefthook = "2.2.2"
zizmor = "1.31.1"
"github:postfinance/topf" = "0.6.2"
shellcheck = "0.11.0"
taplo = "0.10.0"
oxfmt = "0.75.0"

[env]
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
KUBECONFIG = "{{config_root}}/kubeconfig"
_.python.venv = { path = ".venv", create = true }
