---
# Two groups: test (VirtualBox VM) and prod (the NUC).
# Addresses and users are variables (see group_vars/all/main.yml) so nothing is hardcoded here.
# Override them in group_vars/all/local.yml (git-ignored) or with -e on the command line.
all:
  children:
    test:
      hosts:
        homelab-test:
          ansible_host: "{{ test_host_ip }}"
          ansible_user: "{{ test_ssh_user }}"
    prod:
      hosts:
        homelab-prod:
          ansible_host: "{{ prod_host_ip }}"
          ansible_user: "{{ prod_ssh_user }}"
