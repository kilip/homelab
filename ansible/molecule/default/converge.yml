---
- name: Converge common role
  hosts: all
  become: true
  gather_facts: true
  roles:
    - role: common

- name: Converge auto_upgrade role
  hosts: all
  become: true
  gather_facts: true
  roles:
    - role: auto_upgrade

- name: Converge k3s role
  hosts: k3s
  become: true
  gather_facts: true
  roles:
    - role: k3s

- name: Converge app role
  hosts: all
  become: true
  gather_facts: true
  roles:
    - role: app
      vars:
        app_docker: true
        app_mosquitto: true
        app_mosquitto_users:
          - username: molecule_user
            password: molecule_password
        app_rustfs: true
        app_node_exporter: true
        app_zerotier: true
