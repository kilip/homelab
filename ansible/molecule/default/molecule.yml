---
dependency:
  name: galaxy
  enabled: false

driver:
  name: docker

platforms:
  - name: ubuntu
    image: ubuntu:26.04
    pre_build_image: true
    privileged: true
    command: sleep infinity
    volumes:
      - "${MOLECULE_PROJECT_DIRECTORY}/../.cache/molecule/ubuntu/apt-cache:/var/cache/apt:rw"
      - "${MOLECULE_PROJECT_DIRECTORY}/../.cache/molecule/ubuntu/apt-lists:/var/lib/apt/lists:rw"
      - "${MOLECULE_PROJECT_DIRECTORY}/../.cache/molecule/ubuntu/k3s:/var/cache/k3s:rw"
    groups:
      - k3s
  - name: debian
    image: debian:trixie
    pre_build_image: true
    privileged: true
    command: sleep infinity
    volumes:
      - "${MOLECULE_PROJECT_DIRECTORY}/../.cache/molecule/debian/apt-cache:/var/cache/apt:rw"
      - "${MOLECULE_PROJECT_DIRECTORY}/../.cache/molecule/debian/apt-lists:/var/lib/apt/lists:rw"
  - name: cachyos
    image: cachyos/cachyos:latest
    pre_build_image: true
    privileged: true
    command: sleep infinity
    volumes:
      - "${MOLECULE_PROJECT_DIRECTORY}/../.cache/molecule/cachyos/pacman-pkg:/var/cache/pacman/pkg:rw"
      - "${MOLECULE_PROJECT_DIRECTORY}/../.cache/molecule/cachyos/pacman-sync:/var/lib/pacman/sync:rw"

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/roles"
  inventory:
    group_vars:
      all:
        ansible_user: root
        app_docker_start_service: false
        app_mosquitto_start_service: false
        app_rustfs_start_service: false
      k3s:
        k3s_start_service: false
        k3s_fetch_kubeconfig: false
  config_options:
    defaults:
      interpreter_python: auto_silent
      stdout_callback: default
      result_format: yaml

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
