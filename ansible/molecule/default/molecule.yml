---
dependency:
  name: galaxy
  enabled: false

driver:
  name: docker

platforms:
  - name: ubuntu
    image: ubuntu:26.04
    pre_build_image: true
    command: sleep infinity
    groups:
      - k3s
  - name: debian
    image: debian:13
    pre_build_image: true
    command: sleep infinity
  - name: cachyos
    image: cachyos/cachyos:latest
    pre_build_image: true
    command: sleep infinity

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/roles"
  inventory:
    group_vars:
      all:
        ansible_user: root
      k3s:
        k3s_start_service: false
        k3s_fetch_kubeconfig: false
  config_options:
    defaults:
      interpreter_python: auto_silent
      stdout_callback: default
      result_format: yaml

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
