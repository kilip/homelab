---
- name: Prepare containers with Python runtime for Ansible
  hosts: all
  gather_facts: false
  tasks:
    - name: Bootstrap Python and python3-apt on Debian/Ubuntu
      ansible.builtin.raw: |
        if command -v apt-get >/dev/null 2>&1; then
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq && apt-get install -y -qq python3 python3-apt sudo
        fi
      changed_when: false

    - name: Bootstrap Python on CachyOS
      ansible.builtin.raw: |
        if command -v pacman >/dev/null 2>&1; then
          pacman -Sy --noconfirm python sudo
        fi
      changed_when: false
