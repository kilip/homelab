---
- name: Verify common role package cache and upgrade state
  hosts: all
  gather_facts: true
  vars_files:
    - ../../roles/common/defaults/main.yml
  tasks:
    - name: Verify apt package lists exist on Debian/Ubuntu
      ansible.builtin.stat:
        path: /var/lib/apt/lists
      register: apt_lists
      failed_when: not apt_lists.stat.exists or not apt_lists.stat.isdir
      when: ansible_facts['os_family'] == 'Debian'

    - name: Check no pending apt upgrades remain on Debian/Ubuntu
      ansible.builtin.apt:
        upgrade: dist
        update_cache: false
      check_mode: true
      register: apt_upgrade_check
      failed_when: apt_upgrade_check.changed
      when: ansible_facts['os_family'] == 'Debian'

    - name: Check no pending pacman upgrades remain on CachyOS
      community.general.pacman:
        upgrade: true
        update_cache: false
      check_mode: true
      register: pacman_upgrade_check
      failed_when: pacman_upgrade_check.changed
      when: ansible_facts['os_family'] == 'Archlinux'

    - name: Verify common packages are installed
      ansible.builtin.package:
        name: "{{ common_packages }}"
        state: present
      check_mode: true
      register: common_packages_check
      failed_when: common_packages_check.changed
      when: common_packages | length > 0

    - name: Verify passwordless sudo configuration for ansible_user
      community.general.sudoers:
        name: "{{ ansible_user }}"
        user: "{{ ansible_user }}"
        commands: ALL
        nopassword: true
        state: present
      check_mode: true
      register: sudoers_check
      failed_when: sudoers_check.changed

    - name: Verify system hostname matches inventory_hostname
      ansible.builtin.assert:
        that:
          - ansible_facts['hostname'] == inventory_hostname

    - name: Verify /etc/hosts maps 127.0.1.1 to inventory_hostname
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1\s+'
        line: "127.0.1.1 {{ inventory_hostname }}"
      check_mode: true
      register: hosts_check
      failed_when: hosts_check.changed

- name: Verify k3s role installation and configuration
  hosts: k3s
  gather_facts: true
  vars_files:
    - ../../roles/k3s/defaults/main.yml
  tasks:
    - name: Verify K3s kernel modules config exists
      ansible.builtin.stat:
        path: /etc/modules-load.d/k3s.conf
      register: k3s_modules_conf
      failed_when: not k3s_modules_conf.stat.exists

    - name: Verify K3s sysctl config exists
      ansible.builtin.stat:
        path: /etc/sysctl.d/90-k3s.conf
      register: k3s_sysctl_conf
      failed_when: not k3s_sysctl_conf.stat.exists

    - name: Verify K3s config.yaml exists and has expected content
      ansible.builtin.slurp:
        src: "{{ k3s_config_file }}"
      register: k3s_config_raw

    - name: Parse and assert K3s config.yaml content
      vars:
        k3s_config_parsed: "{{ k3s_config_raw.content | b64decode | from_yaml }}"
      ansible.builtin.assert:
        that:
          - k3s_config_parsed['node-name'] == inventory_hostname
          - k3s_config_parsed['write-kubeconfig-mode'] == k3s_write_kubeconfig_mode
          - "'traefik' in k3s_config_parsed['disable']"
          - "'servicelb' in k3s_config_parsed['disable']"
          - "'local-storage' in k3s_config_parsed['disable']"
          - "'metrics-server' in k3s_config_parsed['disable']"
          - inventory_hostname in k3s_config_parsed['tls-san']

    - name: Verify K3s binary is installed and matches pinned version
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s --version
      register: k3s_version_check
      changed_when: false
      failed_when: k3s_version not in k3s_version_check.stdout

    - name: Verify K3s systemd service unit was generated
      ansible.builtin.stat:
        path: /etc/systemd/system/k3s.service
      register: k3s_service_unit
      failed_when: not k3s_service_unit.stat.exists

    - name: Verify no uncommented swap entries in /etc/fstab
      ansible.builtin.shell:
        cmd: |
          if [ -f /etc/fstab ]; then
            grep -E '^[[:space:]]*[^#[:space:]]+[[:space:]]+[^#[:space:]]+[[:space:]]+swap' /etc/fstab || exit 0
            exit 1
          fi
      changed_when: false

    - name: Persist K3s binary and installer script to Molecule cache
      ansible.builtin.shell:
        cmd: |
          set -eu
          if [ -d /var/cache/k3s ]; then
            cp -f /usr/local/bin/k3s "/var/cache/k3s/k3s-{{ k3s_version }}"
            cp -f "{{ k3s_install_script_path }}" /var/cache/k3s/k3s-install.sh
          fi
      changed_when: false

- name: Verify app role installation and configuration
  hosts: all
  gather_facts: true
  vars_files:
    - ../../roles/app/defaults/main.yml
  tasks:
    - name: Verify docker binary is installed
      ansible.builtin.stat:
        path: /usr/bin/docker
      register: docker_bin_stat
      failed_when: not docker_bin_stat.stat.exists

    - name: Verify docker daemon configuration file exists
      ansible.builtin.stat:
        path: /etc/docker/daemon.json
      register: docker_daemon_stat
      failed_when: not docker_daemon_stat.stat.exists

    - name: Slurp docker daemon configuration
      ansible.builtin.slurp:
        src: /etc/docker/daemon.json
      register: docker_daemon_raw

    - name: Parse and assert docker daemon.json content
      vars:
        daemon_config_parsed: "{{ docker_daemon_raw.content | b64decode | from_json }}"
      ansible.builtin.assert:
        that:
          - daemon_config_parsed['log-driver'] == app_docker_daemon_config['log-driver']
          - daemon_config_parsed['live-restore'] == app_docker_daemon_config['live-restore']

    - name: Verify mosquitto base directory exists
      ansible.builtin.stat:
        path: "{{ app_mosquitto_dir }}"
      register: mosquitto_base_dir_stat
      failed_when: not mosquitto_base_dir_stat.stat.exists or not mosquitto_base_dir_stat.stat.isdir

    - name: Verify mosquitto configuration directory exists
      ansible.builtin.stat:
        path: "{{ app_mosquitto_config_dir }}"
      register: mosquitto_config_dir_stat
      failed_when: not mosquitto_config_dir_stat.stat.exists or not mosquitto_config_dir_stat.stat.isdir

    - name: Verify mosquitto data directory exists
      ansible.builtin.stat:
        path: "{{ app_mosquitto_data_dir }}"
      register: mosquitto_data_dir_stat
      failed_when: not mosquitto_data_dir_stat.stat.exists or not mosquitto_data_dir_stat.stat.isdir

    - name: Verify mosquitto log directory exists
      ansible.builtin.stat:
        path: "{{ app_mosquitto_log_dir }}"
      register: mosquitto_log_dir_stat
      failed_when: not mosquitto_log_dir_stat.stat.exists or not mosquitto_log_dir_stat.stat.isdir

    - name: Verify mosquitto config exists and has valid listener setting
      ansible.builtin.lineinfile:
        path: "{{ app_mosquitto_config_dir }}/mosquitto.conf"
        line: "listener {{ app_mosquitto_container_port }}"
      check_mode: true
      register: mosquitto_conf_check
      failed_when: mosquitto_conf_check.changed

    - name: Verify mosquitto password file exists
      ansible.builtin.stat:
        path: "{{ app_mosquitto_config_dir }}/passwd"
      register: mosquitto_passwd_stat
      failed_when: not mosquitto_passwd_stat.stat.exists

    - name: Verify provisioned user exists in passwd file
      ansible.builtin.lineinfile:
        path: "{{ app_mosquitto_config_dir }}/passwd"
        regexp: '^molecule_user:'
        state: present
      check_mode: true
      register: mosquitto_user_check
      failed_when: mosquitto_user_check.changed

    - name: Verify rustfs base directory exists
      ansible.builtin.stat:
        path: "{{ app_rustfs_dir }}"
      register: rustfs_base_dir_stat
      failed_when: not rustfs_base_dir_stat.stat.exists or not rustfs_base_dir_stat.stat.isdir

    - name: Verify rustfs data directory exists with correct permissions
      ansible.builtin.stat:
        path: "{{ app_rustfs_data_dir }}"
      register: rustfs_data_dir_stat
      failed_when:
        - not rustfs_data_dir_stat.stat.exists
        - not rustfs_data_dir_stat.stat.isdir
        - rustfs_data_dir_stat.stat.uid != (app_rustfs_uid | int)
        - rustfs_data_dir_stat.stat.gid != (app_rustfs_gid | int)
        - rustfs_data_dir_stat.stat.mode != '0750'

    - name: Verify prometheus node exporter binary exists
      ansible.builtin.stat:
        path: /usr/bin/prometheus-node-exporter
      register: node_exporter_bin_stat
      failed_when: not node_exporter_bin_stat.stat.exists

    - name: Verify prometheus node exporter configuration file exists (Debian/Ubuntu)
      ansible.builtin.lineinfile:
        path: /etc/default/prometheus-node-exporter
        line: 'ARGS="--web.listen-address={{ app_node_exporter_bind_address }}:{{ app_node_exporter_port }}"'
      check_mode: true
      register: node_exporter_debian_config_check
      failed_when: node_exporter_debian_config_check.changed
      when: ansible_facts['os_family'] == 'Debian'

    - name: Verify prometheus node exporter configuration file exists (CachyOS)
      ansible.builtin.lineinfile:
        path: /etc/conf.d/prometheus-node-exporter
        line: 'NODE_EXPORTER_ARGS="--web.listen-address={{ app_node_exporter_bind_address }}:{{ app_node_exporter_port }}"'
      check_mode: true
      register: node_exporter_arch_config_check
      failed_when: node_exporter_arch_config_check.changed
      when: ansible_facts['os_family'] == 'Archlinux'
