---
app_docker: false
app_docker_start_service: true
app_docker_users:
  - "{{ ansible_user }}"
app_docker_daemon_config:
  log-driver: "json-file"
  log-opts:
    max-size: "50m"
    max-file: "3"
  live-restore: true
app_docker_packages_debian:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
  - python3-docker
app_docker_packages_archlinux:
  - docker
  - docker-buildx
  - docker-compose
  - python-docker
app_docker_packages: []

app_mosquitto: false
app_mosquitto_container_name: mosquitto
app_mosquitto_image: "eclipse-mosquitto:2"
app_mosquitto_start_service: true
app_mosquitto_dir: /srv/mosquitto
app_mosquitto_config_dir: "{{ app_mosquitto_dir }}/config"
app_mosquitto_data_dir: "{{ app_mosquitto_dir }}/data"
app_mosquitto_log_dir: "{{ app_mosquitto_dir }}/log"
app_mosquitto_port: 1883
app_mosquitto_container_port: 1883
app_mosquitto_bind_address: "0.0.0.0"
app_mosquitto_allow_anonymous: false
app_mosquitto_persistence: true
app_mosquitto_users: "{{ app_mosquitto_user | default([]) }}"
app_mosquitto_uid: "1883"
app_mosquitto_gid: "1883"
app_mosquitto_service: mosquitto
app_mosquitto_packages: []

app_rustfs: false
app_rustfs_container_name: rustfs
app_rustfs_image: "rustfs/rustfs:1.0.1"
app_rustfs_start_service: true
app_rustfs_dir: /srv/rustfs
app_rustfs_data_dir: "{{ app_rustfs_dir }}/data"
app_rustfs_port: 9000
app_rustfs_container_port: 9000
app_rustfs_console_port: 9001
app_rustfs_container_console_port: 9001
app_rustfs_bind_address: "0.0.0.0"
app_rustfs_access_key: "rustfsadmin"
app_rustfs_secret_key: "rustfsadmin"
app_rustfs_uid: "10001"
app_rustfs_gid: "10001"
app_rustfs_purge_data: false

app_node_exporter: false
app_node_exporter_start_service: true
app_node_exporter_service: prometheus-node-exporter
app_node_exporter_port: 9100
app_node_exporter_bind_address: "0.0.0.0"
app_node_exporter_extra_flags: []
app_node_exporter_packages_debian:
  - prometheus-node-exporter
app_node_exporter_packages_archlinux:
  - prometheus-node-exporter
app_node_exporter_packages: []

app_zerotier: false
app_zerotier_start_service: true
app_zerotier_service: zerotier-one
app_zerotier_packages_debian:
  - zerotier-one
app_zerotier_packages_archlinux:
  - zerotier-one
app_zerotier_packages: []
app_zerotier_networks: []
