---
- name: Restart docker
  ansible.builtin.systemd_service:
    name: docker
    state: restarted
  when: app_docker_start_service | bool

- name: Restart mosquitto
  community.docker.docker_container:
    name: "{{ app_mosquitto_container_name }}"
    restart: true
  when: app_mosquitto_start_service | bool
