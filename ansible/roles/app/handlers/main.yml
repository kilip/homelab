---
- name: Restart docker
  ansible.builtin.systemd_service:
    name: docker
    state: restarted
  when:
    - app_docker_start_service | bool
    - not ansible_check_mode
- name: Restart mosquitto
  community.docker.docker_container:
    name: "{{ app_mosquitto_container_name }}"
    image: "{{ app_mosquitto_image }}"
    restart: true
  when:
    - app_mosquitto_start_service | bool
    - not ansible_check_mode
- name: Restart rustfs
  community.docker.docker_container:
    name: "{{ app_rustfs_container_name }}"
    image: "{{ app_rustfs_image }}"
    restart: true
  when:
    - app_rustfs_start_service | bool
    - not ansible_check_mode
- name: Restart prometheus-node-exporter
  ansible.builtin.systemd_service:
    name: "{{ app_node_exporter_service }}"
    state: restarted
  when:
    - app_node_exporter_start_service | bool
    - not ansible_check_mode
