---
- name: Verify role variables
  ansible.builtin.import_tasks: verify.yml

- name: Manage docker
  ansible.builtin.include_tasks:
    file: "docker.yml"

- name: Manage mosquitto
  ansible.builtin.include_tasks:
    file: "mosquitto.yml"
  when: app_docker | bool

- name: Manage rustfs
  ansible.builtin.include_tasks:
    file: "rustfs.yml"
  when: app_docker | bool

- name: Manage prometheus node exporter
  ansible.builtin.include_tasks:
    file: "node_exporter.yml"

- name: Manage zerotier
  ansible.builtin.include_tasks:
    file: "zerotier.yml"

- name: Manage bluez
  ansible.builtin.include_tasks:
    file: "bluez.yml"
