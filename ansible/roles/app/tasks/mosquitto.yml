---
- name: Check if Docker daemon socket exists
  ansible.builtin.stat:
    path: /var/run/docker.sock
  register: app_docker_socket

- name: Ensure mosquitto installed and configured
  when: app_mosquitto | bool
  block:
    - name: Ensure legacy host mosquitto service is stopped and disabled
      ansible.builtin.service:
        name: "{{ app_mosquitto_service }}"
        state: stopped
        enabled: false
      failed_when: false
      when: app_mosquitto_start_service | bool

    - name: Ensure mosquitto persistent directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ app_mosquitto_uid }}"
        group: "{{ app_mosquitto_gid }}"
        mode: "0750"
      loop:
        - "{{ app_mosquitto_dir }}"
        - "{{ app_mosquitto_config_dir }}"
        - "{{ app_mosquitto_data_dir }}"
        - "{{ app_mosquitto_log_dir }}"

    - name: Configure mosquitto configuration
      ansible.builtin.template:
        src: mosquitto.conf.j2
        dest: "{{ app_mosquitto_config_dir }}/mosquitto.conf"
        owner: "{{ app_mosquitto_uid }}"
        group: "{{ app_mosquitto_gid }}"
        mode: "0640"
      notify: Restart mosquitto

    - name: Configure mosquitto password file
      ansible.builtin.template:
        src: passwd.j2
        dest: "{{ app_mosquitto_config_dir }}/passwd"
        owner: "{{ app_mosquitto_uid }}"
        group: "{{ app_mosquitto_gid }}"
        mode: "0600"
      when: not (app_mosquitto_allow_anonymous | bool) or (app_mosquitto_users | length > 0)
      notify: Restart mosquitto

    - name: Ensure mosquitto container is running
      community.docker.docker_container:
        name: "{{ app_mosquitto_container_name }}"
        image: "{{ app_mosquitto_image }}"
        state: started
        restart_policy: unless-stopped
        published_ports:
          - "{{ (app_mosquitto_bind_address + ':') if app_mosquitto_bind_address else '' }}{{ app_mosquitto_port }}:{{ app_mosquitto_container_port }}"
        volumes:
          - "{{ app_mosquitto_config_dir }}:/mosquitto/config:ro"
          - "{{ app_mosquitto_data_dir }}:/mosquitto/data:rw"
          - "{{ app_mosquitto_log_dir }}:/mosquitto/log:rw"
      when:
        - app_mosquitto_start_service | bool
        - not ansible_check_mode or (app_docker_socket.stat.exists | default(false))

- name: Ensure mosquitto uninstalled
  when: not (app_mosquitto | bool)
  block:
    - name: Ensure mosquitto container is stopped and removed
      community.docker.docker_container:
        name: "{{ app_mosquitto_container_name }}"
        state: absent
      when:
        - app_docker | bool
        - app_mosquitto_start_service | bool
        - not ansible_check_mode or (app_docker_socket.stat.exists | default(false))

    - name: Remove mosquitto persistent directories
      ansible.builtin.file:
        path: "{{ app_mosquitto_dir }}"
        state: absent
