---
- name: Assert app role variables are valid
  ansible.builtin.assert:
    that:
      - (not (app_mosquitto | bool)) or (app_docker | bool)
      - app_docker is boolean
      - app_docker_start_service is boolean
      - app_docker_users is sequence
      - app_docker_daemon_config is mapping
      - app_docker_packages is sequence
      - app_mosquitto is boolean
      - app_mosquitto_start_service is boolean
      - app_mosquitto_container_name is string
      - app_mosquitto_image is string
      - app_mosquitto_dir is string
      - app_mosquitto_config_dir is string
      - app_mosquitto_data_dir is string
      - app_mosquitto_log_dir is string
      - app_mosquitto_port | int > 0
      - app_mosquitto_port | int < 65536
      - app_mosquitto_container_port | int > 0
      - app_mosquitto_container_port | int < 65536
      - app_mosquitto_packages is sequence
      - app_mosquitto_users is sequence
      - (not (app_rustfs | bool)) or (app_docker | bool)
      - app_rustfs is boolean
      - app_rustfs_start_service is boolean
      - app_rustfs_container_name is string
      - app_rustfs_image is string
      - app_rustfs_dir is string
      - app_rustfs_data_dir is string
      - app_rustfs_port | int > 0
      - app_rustfs_port | int < 65536
      - app_rustfs_container_port | int > 0
      - app_rustfs_container_port | int < 65536
      - app_rustfs_console_port | int > 0
      - app_rustfs_console_port | int < 65536
      - app_rustfs_container_console_port | int > 0
      - app_rustfs_container_console_port | int < 65536
      - app_rustfs_access_key is string
      - app_rustfs_secret_key is string
      - app_rustfs_purge_data is boolean
      - app_node_exporter is boolean
      - app_node_exporter_start_service is boolean
      - app_node_exporter_service is string
      - app_node_exporter_port | int > 0
      - app_node_exporter_port | int < 65536
      - app_node_exporter_bind_address is string
      - app_node_exporter_extra_flags is sequence
      - app_node_exporter_packages is sequence
    quiet: true
