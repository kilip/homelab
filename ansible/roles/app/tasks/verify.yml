---
- name: Assert app role variables are valid
  ansible.builtin.assert:
    that:
      - app_docker is boolean
      - app_docker_start_service is boolean
      - app_docker_users is sequence
      - app_docker_daemon_config is mapping
      - app_docker_packages is sequence
      - app_mosquitto is boolean
      - app_mosquitto_start_service is boolean
      - app_mosquitto_container_name is string
      - app_mosquitto_image is string
      - app_mosquitto_dir is string
      - app_mosquitto_config_dir is string
      - app_mosquitto_data_dir is string
      - app_mosquitto_log_dir is string
      - app_mosquitto_port | int > 0
      - app_mosquitto_port | int < 65536
      - app_mosquitto_container_port | int > 0
      - app_mosquitto_container_port | int < 65536
      - app_mosquitto_packages is sequence
      - app_mosquitto_users is sequence
    quiet: true
