---
- name: Set debian package details for chezmoi
  ansible.builtin.set_fact:
    common_chezmoi_deb_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts['architecture']] | default(ansible_facts['architecture']) }}"
  when: ansible_facts['os_family'] == 'Debian'

- name: Set debian package filename for chezmoi
  ansible.builtin.set_fact:
    common_chezmoi_deb_pkg: "chezmoi_{{ common_chezmoi_version }}_linux_{{ common_chezmoi_deb_arch }}.deb"
  when: ansible_facts['os_family'] == 'Debian'

- name: Ensure chezmoi package is installed (Debian/Ubuntu)
  ansible.builtin.apt:
    deb: "https://github.com/twpayne/chezmoi/releases/download/v{{ common_chezmoi_version }}/{{ common_chezmoi_deb_pkg }}"
    state: present
  when: ansible_facts['os_family'] == 'Debian'

- name: Ensure chezmoi package is installed (Archlinux)
  community.general.pacman:
    name: chezmoi
    state: present
  when: ansible_facts['os_family'] == 'Archlinux'

- name: Load chezmoi backup from SOPS file
  community.sops.load_vars:
    file: "{{ common_chezmoi_age_sops_file }}"
  when:
    - common_chezmoi_age_key | length == 0
    - common_chezmoi_age_sops_file | length > 0
  no_log: true

- name: Retrieve passwd entry for ansible_user
  ansible.builtin.getent:
    database: passwd
    key: "{{ ansible_user }}"

- name: Set ansible_user home directory for chezmoi
  ansible.builtin.set_fact:
    common_user_home: "{{ ansible_facts.getent_passwd[ansible_user][4] }}"

- name: Ensure chezmoi config directory exists
  ansible.builtin.file:
    path: "{{ common_user_home }}/.config/chezmoi"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"
  when: common_chezmoi_age_key | length > 0

- name: Copy age key for chezmoi
  ansible.builtin.copy:
    content: "{{ (common_chezmoi_age_key | trim) ~ '\n' }}"
    dest: "{{ common_user_home }}/.config/chezmoi/age.key"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  when: common_chezmoi_age_key | length > 0
  no_log: true

- name: Initialize chezmoi dotfiles repository
  when: common_chezmoi_init | bool
  block:
    - name: Initialize chezmoi with dotfiles repository
      ansible.builtin.command:
        cmd: "chezmoi init {{ common_chezmoi_repo }}"
        creates: "{{ common_user_home }}/.local/share/chezmoi/.git"
      become: true
      become_user: "{{ ansible_user }}"
      environment:
        HOME: "{{ common_user_home }}"

- name: Apply chezmoi dotfiles
  when: common_chezmoi_apply | bool
  block:
    - name: Check for chezmoi dotfiles changes
      ansible.builtin.command:
        cmd: chezmoi status
      become: true
      become_user: "{{ ansible_user }}"
      environment:
        HOME: "{{ common_user_home }}"
      register: common_chezmoi_status
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Apply chezmoi dotfiles state
      ansible.builtin.command:
        cmd: chezmoi apply --force
      become: true
      become_user: "{{ ansible_user }}"
      environment:
        HOME: "{{ common_user_home }}"
      changed_when: true
      when:
        - common_chezmoi_status.rc == 0
        - common_chezmoi_status.stdout | length > 0
