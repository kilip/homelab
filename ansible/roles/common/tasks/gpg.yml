---
- name: Load GPG backup from SOPS file
  community.sops.load_vars:
    file: "{{ common_gpg_sops_file }}"
  when: common_gpg_private_key | length == 0
  no_log: true

- name: Verify GPG private key content is present
  ansible.builtin.assert:
    that:
      - common_gpg_private_key is string
      - common_gpg_private_key | length > 0
    fail_msg: "common_gpg_private_key must be non-empty when common_gpg is enabled."

- name: Retrieve passwd entry for ansible_user
  ansible.builtin.getent:
    database: passwd
    key: "{{ ansible_user }}"

- name: Set ansible_user home directory for GPG
  ansible.builtin.set_fact:
    common_user_home: "{{ ansible_facts.getent_passwd[ansible_user][4] }}"

- name: Ensure .gnupg directory exists for ansible_user
  ansible.builtin.file:
    path: "{{ common_user_home }}/.gnupg"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"

- name: Check if GPG secret key is already imported with ultimate trust
  ansible.builtin.command:
    cmd: "gpg --batch --list-secret-keys --with-colons {{ common_gpg_key_id }}"
  become: true
  become_user: "{{ ansible_user }}"
  environment:
    HOME: "{{ common_user_home }}"
    GNUPGHOME: "{{ common_user_home }}/.gnupg"
  register: common_gpg_key_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: Import GPG private key for ansible_user
  ansible.builtin.command:
    cmd: gpg --batch --import
    stdin: "{{ common_gpg_private_key }}"
  become: true
  become_user: "{{ ansible_user }}"
  environment:
    HOME: "{{ common_user_home }}"
    GNUPGHOME: "{{ common_user_home }}/.gnupg"
  when:
    - not ansible_check_mode
    - common_gpg_key_check.rc != 0
  changed_when: true
  no_log: true

- name: Import GPG ownertrust for ansible_user
  ansible.builtin.command:
    cmd: gpg --batch --import-ownertrust
    stdin: "{{ (common_gpg_ownertrust | trim) ~ '\n' }}"
    stdin_add_newline: false
  become: true
  become_user: "{{ ansible_user }}"
  environment:
    HOME: "{{ common_user_home }}"
    GNUPGHOME: "{{ common_user_home }}/.gnupg"
  when:
    - not ansible_check_mode
    - common_gpg_key_check.rc != 0 or ('sec:u:' not in common_gpg_key_check.stdout)
  changed_when: true
