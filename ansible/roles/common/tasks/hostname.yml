---
- name: Set the hostname from the inventory
  ansible.builtin.hostname:
    name: "{{ node_hostname }}"

# Ubuntu resolves its own hostname through 127.0.1.1; without it sudo warns on every call.
- name: Map the hostname to 127.0.1.1 in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1 {{ node_hostname }}"
    owner: root
    group: root
    mode: "0644"
