---
- name: Verify role variables
  ansible.builtin.import_tasks: verify.yml

- name: Refresh apt cache and upgrade packages (Debian/Ubuntu)
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
  when: ansible_facts['os_family'] == 'Debian'

- name: Refresh pacman cache and upgrade packages (CachyOS)
  community.general.pacman:
    update_cache: true
    upgrade: true
  when: ansible_facts['os_family'] == 'Archlinux'

- name: Install common packages
  ansible.builtin.package:
    name: "{{ common_packages }}"
    state: present
  when: common_packages | length > 0

- name: Configure passwordless sudo for ansible_user
  community.general.sudoers:
    name: "{{ ansible_user }}"
    user: "{{ ansible_user }}"
    commands: ALL
    nopassword: true
    state: present
