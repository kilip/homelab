---
- name: Refresh apt cache and upgrade packages (Debian/Ubuntu)
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
  when: ansible_facts['os_family'] == 'Debian'

- name: Refresh pacman cache and upgrade packages (CachyOS)
  community.general.pacman:
    update_cache: true
    upgrade: true
  when: ansible_facts['os_family'] == 'Archlinux'

- name: Install common packages
  ansible.builtin.package:
    name: "{{ common_packages }}"
    state: present
  when: common_packages | length > 0
