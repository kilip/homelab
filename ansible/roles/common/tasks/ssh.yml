---
- name: Check if SSH key SOPS file exists for host
  ansible.builtin.stat:
    path: "{{ common_ssh_key_sops_file }}"
  delegate_to: localhost
  become: false
  register: common_ssh_key_sops_stat

- name: Load SSH key from SOPS file
  community.sops.load_vars:
    file: "{{ common_ssh_key_sops_file }}"
  when:
    - common_ssh_private_key | length == 0
    - common_ssh_key_sops_stat.stat.exists
  no_log: true

- name: Deploy SSH keys for ansible_user
  when: common_ssh_private_key | length > 0
  block:
    - name: Retrieve passwd entry for ansible_user
      ansible.builtin.getent:
        database: passwd
        key: "{{ ansible_user }}"

    - name: Set ansible_user home directory for SSH
      ansible.builtin.set_fact:
        common_user_home: "{{ ansible_facts.getent_passwd[ansible_user][4] }}"

    - name: Ensure .ssh directory exists for ansible_user
      ansible.builtin.file:
        path: "{{ common_user_home }}/.ssh"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0700"

    - name: Copy SSH private key for ansible_user
      ansible.builtin.copy:
        content: "{{ (common_ssh_private_key | trim) ~ '\n' }}"
        dest: "{{ common_user_home }}/.ssh/id_ed25519"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"
      no_log: true

    - name: Copy SSH public key for ansible_user
      ansible.builtin.copy:
        content: "{{ (common_ssh_public_key | trim) ~ '\n' }}"
        dest: "{{ common_user_home }}/.ssh/id_ed25519.pub"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"
      when: common_ssh_public_key | length > 0
