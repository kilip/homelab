---
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
  when: common_unattended_upgrades | bool

- name: Enable periodic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      // Managed by Ansible (role: common)
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"
  when: common_unattended_upgrades | bool

- name: Configure unattended-upgrades behaviour
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52homelab-unattended-upgrades
    content: |
      // Managed by Ansible (role: common)
      Unattended-Upgrade::Automatic-Reboot "{{ common_unattended_auto_reboot | bool | lower }}";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
    owner: root
    group: root
    mode: "0644"
  when: common_unattended_upgrades | bool
