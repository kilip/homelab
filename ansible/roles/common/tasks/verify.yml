---
- name: Verify required variables are defined
  ansible.builtin.assert:
    that:
      - ansible_user is defined
      - ansible_user | length > 0
    fail_msg: "ansible_user must be defined"

- name: Verify chezmoi configuration variables
  ansible.builtin.assert:
    that:
      - common_chezmoi_enabled is boolean
      - common_chezmoi_init is boolean
      - common_chezmoi_apply is boolean
      - common_chezmoi_repo is string
      - common_chezmoi_repo | length > 0
      - common_chezmoi_version is string
      - common_chezmoi_version | length > 0
      - common_chezmoi_age_sops_file is string
      - common_chezmoi_age_key is string
    fail_msg: "Invalid common chezmoi variable configuration."
  when: common_chezmoi_enabled | bool

- name: Verify gpg configuration variables
  ansible.builtin.assert:
    that:
      - common_gpg is boolean
      - common_gpg_key_id is string
      - common_gpg_key_id | length > 0
      - common_gpg_ownertrust is string
      - common_gpg_ownertrust | length > 0
      - common_gpg_sops_file is string
      - common_gpg_sops_file | length > 0
    fail_msg: "Invalid common gpg variable configuration."
  when: common_gpg | bool

- name: Verify password store configuration variables
  ansible.builtin.assert:
    that:
      - common_pass is boolean
      - common_pass_repo is string
      - common_pass_repo | length > 0
      - common_pass_version is string
      - common_pass_version | length > 0
      - common_pass_update is boolean
      - common_pass_dir is string
      - common_pass_ssh_key is string
    fail_msg: "Invalid common password store variable configuration."
  when: common_pass | bool

- name: Verify SSH key configuration variables
  ansible.builtin.assert:
    that:
      - common_ssh_key_enabled is boolean
      - common_ssh_key_sops_file is string
      - common_ssh_key_sops_file | length > 0
      - common_ssh_private_key is string
      - common_ssh_public_key is string
    fail_msg: "Invalid common SSH key variable configuration."
  when: common_ssh_key_enabled | bool
