---
# Master toggle for Zeus workstation role
zeus_enabled: true

# Target non-root workstation user
zeus_user: "{{ ansible_user }}"

# Custom pacman packages for Zeus workstation
zeus_packages:
  - rofi
  - waybar

# Paru AUR packages for Zeus workstation
zeus_paru_enabled: true
zeus_paru_packages:
  - google-chrome
  - visual-studio-code-bin
  - pgadmin4-desktop
  - openrgb

# DeepCool Digital display service (Nortank12/deepcool-digital-linux)
zeus_deepcool_enabled: true
zeus_deepcool_start_service: true
zeus_deepcool_version: "v0.11.0-alpha"
zeus_deepcool_binary_url: "https://github.com/Nortank12/deepcool-digital-linux/releases/download/{{ zeus_deepcool_version }}/deepcool-digital-linux"
zeus_deepcool_install_dir: "/usr/local/bin"
zeus_deepcool_extra_args: ""

# Wake-on-LAN configuration for Zeus workstation
zeus_wakeonlan_enabled: true
zeus_wakeonlan_start_service: true
zeus_wakeonlan_mac: "08:bf:b8:14:34:aa"

# Headroom proxy service (ghcr.io/headroomlabs-ai/headroom)
zeus_headroom_enabled: false
zeus_headroom_start_service: true
zeus_headroom_container_name: "headroom"
zeus_headroom_image: "ghcr.io/headroomlabs-ai/headroom:latest"
zeus_headroom_port: 8787
zeus_headroom_container_port: 8787
zeus_headroom_bind_address: ""
zeus_headroom_mode: "cache"
zeus_headroom_savings_profile: "coding"
zeus_headroom_upstream_openai_url: ""
zeus_headroom_upstream_anthropic_url: ""
zeus_headroom_allow_unauthenticated_bind: true
zeus_headroom_telemetry: false
zeus_headroom_firewall_enabled: true
zeus_headroom_extra_env: {}
