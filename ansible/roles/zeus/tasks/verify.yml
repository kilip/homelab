---
- name: Verify zeus role variables
  ansible.builtin.assert:
    that:
      - zeus_enabled is boolean
      - zeus_packages is sequence
      - zeus_user is string
      - zeus_user | length > 0
      - zeus_paru_enabled is boolean
      - zeus_paru_packages is sequence
    fail_msg: "Invalid zeus role variable configuration."

- name: Verify target OS family is Archlinux
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Archlinux'
    fail_msg: "The zeus role only supports Archlinux/CachyOS workstations (detected: {{ ansible_facts['os_family'] }})."
  when: zeus_enabled | bool

- name: Verify deepcool configuration variables
  ansible.builtin.assert:
    that:
      - zeus_deepcool_enabled is boolean
      - zeus_deepcool_start_service is boolean
      - zeus_deepcool_version is string
      - zeus_deepcool_version | length > 0
      - zeus_deepcool_binary_url is string
      - zeus_deepcool_binary_url | length > 0
      - zeus_deepcool_install_dir is string
      - zeus_deepcool_install_dir | length > 0
      - zeus_deepcool_extra_args is string
    fail_msg: "Invalid zeus deepcool variable configuration."
  when:
    - zeus_enabled | bool
    - zeus_deepcool_enabled | bool

- name: Verify wakeonlan configuration variables
  ansible.builtin.assert:
    that:
      - zeus_wakeonlan_enabled is boolean
      - zeus_wakeonlan_start_service is boolean
      - zeus_wakeonlan_mac is string
      - zeus_wakeonlan_mac | length > 0
    fail_msg: "Invalid zeus wakeonlan variable configuration."
  when:
    - zeus_enabled | bool
    - zeus_wakeonlan_enabled | bool
