---
apiVersion: v1
kind: Service
metadata:
  name: dev
  labels:
    app.kubernetes.io/name: dev
spec:
  ports:
    - name: http
      port: 5173
      targetPort: 5173
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: dev
  labels:
    app.kubernetes.io/name: dev
subsets:
  - addresses:
      - ip: "${ZEUS_IP}"
    ports:
      - name: http
        port: 5173
        protocol: TCP
