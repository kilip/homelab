---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: knife
  labels:
    app.kubernetes.io/name: knife
  annotations:
    external-dns.alpha.kubernetes.io/expose: "true"
    external-dns.kubernetes.io/target: "${CLOUDFLARE_TUNNEL_ID}.cfargotunnel.com"
spec:
  ingressClassName: traefik
  rules:
    - host: knife.${SECRET_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: knife
                port:
                  number: 2222
  tls:
    - hosts:
        - knife.${SECRET_DOMAIN}
