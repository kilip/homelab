---
apiVersion: v1
kind: Service
metadata:
  name: knife
  labels:
    app.kubernetes.io/name: knife
spec:
  ports:
    - name: http
      port: 2222
      targetPort: 2222
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: knife
  labels:
    app.kubernetes.io/name: knife
subsets:
  - addresses:
      - ip: "${ZEUS_IP}"
    ports:
      - name: http
        port: 2222
        protocol: TCP
