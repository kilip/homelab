---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: llm
  labels:
    app.kubernetes.io/name: llm
  annotations:
    external-dns.alpha.kubernetes.io/expose: "true"
    external-dns.kubernetes.io/target: "${CLOUDFLARE_TUNNEL_ID}.cfargotunnel.com"
spec:
  ingressClassName: traefik
  rules:
    - host: llm.${SECRET_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: llm
                port:
                  number: 20128
  tls:
    - hosts:
        - llm.${SECRET_DOMAIN}
