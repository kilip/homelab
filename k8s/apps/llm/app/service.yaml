---
apiVersion: v1
kind: Service
metadata:
  name: llm
  labels:
    app.kubernetes.io/name: llm
spec:
  ports:
    - name: http
      port: 20128
      targetPort: 20128
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: llm
  labels:
    app.kubernetes.io/name: llm
subsets:
  - addresses:
      - ip: "${EROS_IP}"
    ports:
      - name: http
        port: 20128
        protocol: TCP
