apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: omed-nightly-db-credentials
  namespace: storage
spec:
  hostAPI: https://app.infisical.com/api
  resyncInterval: 60
  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: security
      secretsScope:
        projectId: "${INFISICAL_PROJECT_ID}"
        envSlug: "${INFISICAL_ENV_SLUG}"
        secretsPath: "/storage/omed-nightly-db"
  managedSecretReference:
    secretName: omed-nightly-db-credentials
    secretNamespace: storage
