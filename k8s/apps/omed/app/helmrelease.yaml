---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: omed
spec:
  chartRef:
    kind: OCIRepository
    name: omed
  interval: 1h
  timeout: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: omed-api
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: omed-api
              spec:
                template:
                  spec:
                    initContainers:
                      - name: wait-for-db
                        image: postgres:17-alpine
                        command:
                          - /bin/sh
                          - -c
                          - |
                            until pg_isready -h paradedb-rw.storage.svc -p 5432 -U omed -d omed; do
                              echo "waiting for db..."
                              sleep 2
                            done
  values:
    secrets:
      existingSecret: omed-secret
    api:
      replicaCount: 1
      config:
        mailer:
          driver: memory
        s3:
          driver: s3
          endpoint: "http://rustfs-svc.apps.svc.cluster.local:9000"
          region: "us-east-1"
          forcePathStyle: true
          bucketPrefix: "omed-ws-"
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
    web:
      replicaCount: 1
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
    migrations:
      enabled: true
    ingress:
      enabled: true
      className: traefik
      annotations:
        external-dns.alpha.kubernetes.io/expose: "true"
        external-dns.kubernetes.io/target: "${CLOUDFLARE_TUNNEL_ID}.cfargotunnel.com"
      web:
        host: omed.${SECRET_DOMAIN}
      api:
        host: api.${SECRET_DOMAIN}
      tls:
        - hosts:
            - omed.${SECRET_DOMAIN}
            - api.${SECRET_DOMAIN}
