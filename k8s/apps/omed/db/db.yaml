---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: omed
  namespace: storage
spec:
  cluster:
    name: paradedb
  name: omed
  login: true
  passwordSecret:
    name: omed-db-credentials
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: omed
  namespace: storage
spec:
  cluster:
    name: paradedb
  name: omed
  owner: omed
