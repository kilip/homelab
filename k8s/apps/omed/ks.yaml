---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: omed-db
  namespace: flux-system
spec:
  dependsOn:
    - name: paradedb
    - name: infisical-operator
  interval: 1h
  path: ./k8s/apps/omed/db
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: storage
  postBuild:
    substituteFrom:
      - kind: Secret
        name: settings
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: omed
  namespace: flux-system
spec:
  dependsOn:
    - name: omed-db
    - name: rustfs
    - name: traefik
  interval: 1h
  path: ./k8s/apps/omed/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: apps
  postBuild:
    substituteFrom:
      - kind: Secret
        name: settings
