---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ompweb
  annotations:
    external-dns.alpha.kubernetes.io/expose: "true"
    external-dns.kubernetes.io/target: "${CLOUDFLARE_TUNNEL_ID}.cfargotunnel.com"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`ompweb.${SECRET_DOMAIN}`)
      kind: Rule
      services:
        - name: ompweb
          port: 30177
