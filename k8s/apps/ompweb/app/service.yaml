---
apiVersion: v1
kind: Service
metadata:
  name: ompweb
  labels:
    app.kubernetes.io/name: ompweb
spec:
  ports:
    - name: http
      port: 30177
      targetPort: 30177
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: ompweb
  labels:
    app.kubernetes.io/name: ompweb
subsets:
  - addresses:
      - ip: "${ZEUS_IP}"
    ports:
      - name: http
        port: 30177
        protocol: TCP
