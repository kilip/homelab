---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: opus-dev
  annotations:
    external-dns.alpha.kubernetes.io/expose: "true"
    external-dns.kubernetes.io/target: "${CLOUDFLARE_TUNNEL_ID}.cfargotunnel.com"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`opus-dev.${SECRET_DOMAIN}`)
      kind: Rule
      services:
        - name: opus-dev
          port: 5173
