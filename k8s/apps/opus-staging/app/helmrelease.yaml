# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opus-staging
spec:
  chartRef:
    kind: OCIRepository
    name: opus-staging
  interval: 1h
  timeout: 10m
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    image:
      repository: kilip/opus
      tag: "20261118091220" # {"$imagepolicy": "apps:opus-staging:tag"}
      pullPolicy: Always
    baseUrl: "https://opus-staging.${SECRET_DOMAIN}"
    config:
      bodyLimit: "4194304"
    persistence:
      enabled: true
      existingClaim: opus-staging-data
    podAnnotations:
      secrets.infisical.com/auto-reload: "true"
    podSecurityContext:
      fsGroup: 65532
    extraEnv:
      - name: APP_HOME
        value: /data
    extraEnvFrom:
      - secretRef:
          name: opus-staging-secret
          optional: true
    ingress:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
