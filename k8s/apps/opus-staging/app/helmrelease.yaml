---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opus-staging
spec:
  chartRef:
    kind: OCIRepository
    name: opus-staging
  interval: 1h
  timeout: 10m
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: opus-staging
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: opus-staging
              spec:
                template:
                  spec:
                    containers:
                      - name: opus
                        volumeMounts:
                          - name: data
                            mountPath: /data
                    volumes:
                      - name: data
                        persistentVolumeClaim:
                          claimName: opus-staging-data
  values:
    image:
      repository: kilip/opus
      tag: staging
      pullPolicy: Always
    config:
      bodyLimit: "4194304"
    podAnnotations:
      secrets.infisical.com/auto-reload: "true"
    podSecurityContext:
      fsGroup: 65532
    extraEnvFrom:
      - secretRef:
          name: opus-staging-secret
          optional: true
    ingress:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
