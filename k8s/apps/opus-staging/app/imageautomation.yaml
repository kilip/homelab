---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/image.toolkit.fluxcd.io/imagerepository_v1.json
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: opus-staging
spec:
  image: ghcr.io/kilip/opus
  interval: 10m
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/image.toolkit.fluxcd.io/imagepolicy_v1.json
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: opus-staging
spec:
  imageRepositoryRef:
    name: opus-staging
  filterTags:
    pattern: '^(?P<ts>\d{14})$'
    extract: $ts
  policy:
    numerical:
      order: asc
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/image.toolkit.fluxcd.io/imageupdateautomation_v1.json
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: opus-staging
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: fluxcdbot@users.noreply.github.com
        name: fluxcdbot
      messageTemplate: 'chore: 🔧 update opus-staging image to {{range .Changed.Changes}}{{.NewValue}}{{end}}'
    push:
      branch: main
  update:
    path: ./k8s/apps/opus-staging/app
    strategy: Setters
