---
apiVersion: v1
kind: Service
metadata:
  name: opus-staging-lb
  labels:
    app.kubernetes.io/name: opus
    app.kubernetes.io/instance: opus-staging
spec:
  type: LoadBalancer
  loadBalancerIP: 10.0.0.104
  selector:
    app.kubernetes.io/name: opus
    app.kubernetes.io/instance: opus-staging
  ports:
    - name: http
      port: 7880
      targetPort: http
      protocol: TCP
