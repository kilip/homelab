# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: domus-staging
spec:
  chartRef:
    kind: OCIRepository
    name: domus-staging
  interval: 1h
  timeout: 10m
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: domus-staging
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: domus-staging
                annotations:
                  secrets.infisical.com/auto-reload: "true"
              spec:
                template:
                  spec:
                    initContainers:
                      - name: wait-for-db
                        image: postgres:18-alpine
                        command:
                          - /bin/sh
                          - -c
                          - |
                            until pg_isready -h paradedb-rw.storage.svc -p 5432 -U domus -d domus-staging; do
                              echo "waiting for db..."
                              sleep 2
                            done
  values:
    image:
      repository: paroki/domus
      tag: "staging" # {"$imagepolicy": "apps:domus-staging:tag"}
      digest: "sha256:630ccf9d012a4b52ace1e4741f4c5fd7d6a96af2536beaa338ff497fa4d07ff4" # {"$imagepolicy": "apps:domus-staging:digest"}
      pullPolicy: Always
    config:
      sentry:
        dsn: "https://5f38c577fd038e12e23366f8cd7f4d63@o4507164991684608.ingest.us.sentry.io/4512459590467584"
        environment: staging
      smtp:
        host: smtp.gmail.com
        port: 587
    existingSecret: domus-staging-secret
    extraEnv:
      - name: USER_SUPER_ADMIN_EMAIL
        valueFrom:
          secretKeyRef:
            name: domus-staging-secret
            key: USER_SUPER_ADMIN_EMAIL
      - name: USER_SUPER_ADMIN_NAME
        valueFrom:
          secretKeyRef:
            name: domus-staging-secret
            key: USER_SUPER_ADMIN_NAME
      - name: APP_SMTP_USER
        valueFrom:
          secretKeyRef:
            name: domus-staging-secret
            key: APP_SMTP_USER
      - name: APP_SMTP_FROM
        valueFrom:
          secretKeyRef:
            name: domus-staging-secret
            key: APP_SMTP_FROM
    podAnnotations:
      secrets.infisical.com/auto-reload: "true"
    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        external-dns.alpha.kubernetes.io/expose: "true"
        external-dns.kubernetes.io/target: "${PKRBT_TUNNEL_ID}.cfargotunnel.com"
      hosts:
        - host: domus-staging.pkrbt.id
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: domus-staging-tls
          hosts:
            - domus-staging.pkrbt.id
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
