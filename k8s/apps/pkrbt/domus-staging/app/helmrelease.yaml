# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: domus-staging
spec:
  chartRef:
    kind: OCIRepository
    name: domus-staging
  interval: 1h
  timeout: 10m
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: domus-staging
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: domus-staging
              spec:
                template:
                  spec:
                    initContainers:
                      - name: wait-for-db
                        image: postgres:18-alpine
                        command:
                          - /bin/sh
                          - -c
                          - |
                            until pg_isready -h paradedb-rw.storage.svc -p 5432 -U domus -d domus-staging; do
                              echo "waiting for db..."
                              sleep 2
                            done
                    containers:
                      - name: domus
                        image: ghcr.io/paroki/domus:staging@sha256:a9276d339ec9f3d4271b78f1ca892a5ea7777461796387ee73db704b4c4c7ef7 # {"$imagepolicy": "apps:domus-staging"}
  values:
    image:
      repository: paroki/domus
      tag: "staging"
      pullPolicy: Always
    config:
      user:
        superAdminEmail: toni.munthi@gmail.com
        superAdminName: Anthonius
      sentry:
        dsn: "https://5f38c577fd038e12e23366f8cd7f4d63@o4507164991684608.ingest.us.sentry.io/4512459590467584"
        environment: staging
      smtp:
        host: smtp.gmail.com
        port: 587
        user: toni.munthi@gmail.com
        from: toni.munthi@gmail.com
    existingSecret: domus-staging-secret
    extraEnvFrom:
      - secretRef:
          name: domus-staging-secret
          optional: true
    podAnnotations:
      secrets.infisical.com/auto-reload: "true"
    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        external-dns.alpha.kubernetes.io/expose: "true"
        external-dns.kubernetes.io/target: "${PKRBT_TUNNEL_ID}.cfargotunnel.com"
      hosts:
        - host: domus-staging.pkrbt.id
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: domus-staging-tls
          hosts:
            - domus-staging.pkrbt.id
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
