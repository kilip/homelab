---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pkrbt-tunnel
  namespace: flux-system
spec:
  dependsOn:
    - name: traefik
    - name: infisical-operator
  interval: 10m0s
  retryInterval: 1m0s
  path: ./k8s/apps/pkrbt/tunnel
  prune: true
  wait: false
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: apps
  postBuild:
    substituteFrom:
      - kind: Secret
        name: settings
      - kind: Secret
        name: pkrbt-settings
        optional: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domus-staging-db
  namespace: flux-system
spec:
  dependsOn:
    - name: paradedb
    - name: infisical-operator
  interval: 1h
  path: ./k8s/apps/pkrbt/domus-staging/db
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: storage
  postBuild:
    substituteFrom:
      - kind: Secret
        name: settings
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domus-staging
  namespace: flux-system
spec:
  dependsOn:
    - name: domus-staging-db
    - name: traefik
    - name: pkrbt-tunnel
  interval: 1h
  path: ./k8s/apps/pkrbt/domus-staging/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: apps
  postBuild:
    substituteFrom:
      - kind: Secret
        name: settings
      - kind: Secret
        name: pkrbt-settings
