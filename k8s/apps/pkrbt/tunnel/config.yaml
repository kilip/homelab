---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pkrbt-cloudflared-config
  namespace: apps
data:
  config.yaml: |
    tunnel: ${PKRBT_TUNNEL_ID}
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
      - hostname: "*.pkrbt.id"
        service: https://traefik.network.svc.cluster.local:443
        originRequest:
          noTLSVerify: true
          originServerName: "pkrbt.id"
      - hostname: "pkrbt.id"
        service: https://traefik.network.svc.cluster.local:443
        originRequest:
          noTLSVerify: true
          originServerName: "pkrbt.id"
      - service: http_status:404
