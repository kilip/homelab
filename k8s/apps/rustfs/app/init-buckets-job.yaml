---
apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-init-buckets
  namespace: apps
spec:
  backoffLimit: 15
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustfs-init-buckets
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init-buckets
          image: amazon/aws-cli:latest
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Waiting for RustFS endpoint..."
              until aws --endpoint-url http://rustfs-svc.apps.svc.cluster.local:9000 s3 ls >/dev/null 2>&1; do
                echo "RustFS not ready yet, retrying in 2s..."
                sleep 2
              done
              echo "Creating bucket omed..."
              aws --endpoint-url http://rustfs-svc.apps.svc.cluster.local:9000 s3 mb s3://omed || true
              echo "Creating bucket omed-ws-default..."
              aws --endpoint-url http://rustfs-svc.apps.svc.cluster.local:9000 s3 mb s3://omed-ws-default || true
              echo "Verifying buckets:"
              aws --endpoint-url http://rustfs-svc.apps.svc.cluster.local:9000 s3 ls
              echo "RustFS initial buckets verified successfully!"
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: rustfs-secret
                  key: RUSTFS_ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-secret
                  key: RUSTFS_SECRET_KEY
            - name: AWS_DEFAULT_REGION
              value: us-east-1
