---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: flux-operator-ui
  namespace: flux-system
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`flux.${SECRET_DOMAIN}`)
      kind: Rule
      middlewares:
        - name: internal-only
          namespace: network
      services:
        - name: flux-operator-web
          port: 80
