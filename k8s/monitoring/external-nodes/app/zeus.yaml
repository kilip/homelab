---
apiVersion: v1
kind: Service
metadata:
  name: node-exporter-zeus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: node-exporter
    app.kubernetes.io/instance: zeus
    prometheus.io/scrape: "true"
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9100"
    prometheus.io/path: "/metrics"
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: node-exporter-zeus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: node-exporter
    app.kubernetes.io/instance: zeus
    prometheus.io/scrape: "true"
subsets:
  - addresses:
      - ip: "${ZEUS_IP}"
    ports:
      - name: metrics
        port: 9100
        protocol: TCP
