---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-nodes-monitoring
  namespace: flux-system
spec:
  interval: 10m0s
  retryInterval: 1m0s
  path: ./k8s/monitoring/external-nodes/app
  prune: true
  wait: true
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: Secret
        name: settings
