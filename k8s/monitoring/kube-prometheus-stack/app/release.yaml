---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "92.14.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
      interval: 12h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    crds:
      enabled: true
    defaultRules:
      create: false
    alertmanager:
      enabled: false

    kubeApiServer:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kubeEtcd:
      enabled: false
    coreDns:
      enabled: false

    kubelet:
      enabled: true
      serviceMonitor:
        cAdvisor: true
        interval: 60s
        cAdvisorMetricRelabelings:
          - sourceLabels: [__name__]
            regex: container_(tasks_state|memory_failures_total|blkio_device_usage_total|memory_mapped_file|ulimits_soft|spec_.*|last_seen|file_descriptors|sockets|processes)
            action: drop
        metricRelabelings:
          - sourceLabels: [__name__]
            regex: .*_bucket
            action: drop

    kube-state-metrics:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi

    prometheus-node-exporter:
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi

    prometheusOperator:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi

    prometheus:
      prometheusSpec:
        replicas: 1
        scrapeInterval: 60s
        evaluationInterval: 60s
        retention: 7d
        retentionSize: 2GB
        walCompression: true
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        serviceMonitorSelector: {}
        podMonitorSelector: {}
        serviceMonitorNamespaceSelector: {}
        podMonitorNamespaceSelector: {}
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 1Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 3Gi

    grafana:
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      persistence:
        enabled: false
      defaultDashboardsEnabled: false
      sidecar:
        dashboards:
          enabled: false
        datasources:
          enabled: false
      datasources:
        datasources.yaml:
          apiVersion: 1
          datasources:
            - name: Prometheus
              type: prometheus
              uid: prometheus
              url: http://kube-prometheus-stack-prometheus.monitoring:9090
              isDefault: true
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: default
              orgId: 1
              folder: ""
              type: file
              disableDeletion: false
              editable: true
              options:
                path: /var/lib/grafana/dashboards/default
      dashboards:
        default:
          node-exporter-full:
            gnetId: 1860
            datasource: Prometheus
          k8s-views-global:
            gnetId: 15757
            datasource: Prometheus
          k8s-views-ns:
            gnetId: 15758
            datasource: Prometheus
          k8s-views-pods:
            gnetId: 15760
            datasource: Prometheus
          traefik:
            gnetId: 17346
            datasource: Prometheus
          cloudnative-pg:
            gnetId: 20417
            datasource: Prometheus
          flux:
            gnetId: 16714
            datasource: Prometheus
      resources:
        requests:
          cpu: 25m
          memory: 96Mi
        limits:
          memory: 256Mi
