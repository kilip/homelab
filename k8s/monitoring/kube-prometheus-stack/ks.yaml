---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  dependsOn:
    - name: storage
  interval: 10m0s
  retryInterval: 1m0s
  path: ./k8s/monitoring/kube-prometheus-stack/app
  prune: true
  wait: true
  timeout: 15m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-prometheus-stack-config
  namespace: flux-system
spec:
  dependsOn:
    - name: kube-prometheus-stack
    - name: traefik-config
  interval: 10m0s
  retryInterval: 1m0s
  path: ./k8s/monitoring/kube-prometheus-stack/config
  prune: true
  wait: true
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: Secret
        name: network-vars
