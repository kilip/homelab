---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: network
spec:
  interval: 30m
  chart:
    spec:
      chart: external-dns
      version: "1.23.0"
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: network
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    provider:
      name: cloudflare
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare-api-token
            key: api-token
    sources:
      - ingress
      - traefik-proxy
    policy: sync
    registry: txt
    txtOwnerId: olympus-k3s
    txtPrefix: _external-dns.
    domainFilters:
      - "${SECRET_DOMAIN}"
    annotationFilter: external-dns.alpha.kubernetes.io/expose=true
    triggerLoopOnEvent: true
    extraArgs:
      - --cloudflare-proxied
      - --default-targets=${CLOUDFLARE_TUNNEL_ID}.cfargotunnel.com
      - --force-default-targets
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
