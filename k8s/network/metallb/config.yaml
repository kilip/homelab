---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: default-lan-pool
  namespace: metallb
spec:
  addresses:
    - "${METALLB_IP_RANGE}"
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: default-lan-l2
  namespace: metallb
spec:
  ipAddressPools:
    - default-lan-pool
  interfaces:
    - enp3s0
