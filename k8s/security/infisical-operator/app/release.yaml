---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: infisical-operator
  namespace: security
spec:
  interval: 30m
  chart:
    spec:
      chart: secrets-operator
      version: "0.11.16"
      sourceRef:
        kind: HelmRepository
        name: infisical-helm-charts
        namespace: security
      interval: 12h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
