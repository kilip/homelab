---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infisical-operator
  namespace: flux-system
spec:
  interval: 10m0s
  retryInterval: 1m0s
  path: ./k8s/security/infisical-operator/app
  prune: true
  wait: true
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: security
  decryption:
    provider: sops
    secretRef:
      name: sops-age
