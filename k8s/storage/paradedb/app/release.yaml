---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paradedb
  namespace: storage
spec:
  interval: 30m
  chart:
    spec:
      chart: paradedb
      version: "0.19.15"
      sourceRef:
        kind: HelmRepository
        name: paradedb
        namespace: storage
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    type: paradedb
    mode: standalone
    version:
      postgresql: "18"
      paradedb: "0.26.3"
    cluster:
      instances: 1
      # Single-node cluster: a PDB on one instance would block node drains.
      enablePDB: false
      storage:
        size: 10Gi
        storageClass: local-path
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          memory: 2Gi
      enableSuperuserAccess: true
      superuserSecret: paradedb-superuser-credentials
      monitoring:
        enabled: true
        instrumentation:
          paradedbIndex: true
          pgStatActivity: true
          pgStatStatements: false
          logicalReplication: false
        podMonitor:
          enabled: false
        prometheusRule:
          enabled: false
      initdb:
        database: paradedb
        owner: paradedb
        secret:
          name: paradedb-app-credentials
      services:
        additional:
          - selectorType: rw
            serviceTemplate:
              metadata:
                name: paradedb-lb
                annotations:
                  metallb.io/loadBalancerIPs: "${PARADEDB_LB_IP}"
              spec:
                type: LoadBalancer
    backups:
      enabled: false
