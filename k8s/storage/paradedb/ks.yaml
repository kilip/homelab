---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: paradedb
  namespace: flux-system
spec:
  dependsOn:
    - name: local-path
    - name: cloudnative-pg
    - name: metallb-config
  interval: 10m0s
  retryInterval: 1m0s
  path: ./k8s/storage/paradedb/app
  prune: true
  wait: true
  timeout: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: Secret
        name: network-vars
