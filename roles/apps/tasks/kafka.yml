---
- name: Ensure kafka service configured
  when: kafka | default(false)
  block:
    - name: Create kafka directory
      ansible.builtin.file:
        path: /srv/kafka
        state: directory
        mode: "0755"

    - name: Deploy kafka container
      community.docker.docker_container:
        name: kafka
        image: "{{ kafka_image }}"
        state: started
        restart_policy: unless-stopped
        networks:
          - name: "{{ docker_network }}"
        env:
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: "broker,controller"
          KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
          KAFKA_LISTENERS: "INTERNAL://:9092,CONTROLLER://:9093"
          KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092"
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
          KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
          KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
          KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
        volumes:
          - "/srv/kafka:/var/lib/kafka/data"
        healthcheck:
          test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
          interval: 10s
          timeout: 10s
          retries: 10
          start_period: 20s

    - name: Deploy kafka ui
      community.docker.docker_container:
        name: kafka-ui
        image: ghcr.io/kafbat/kafka-ui:v1.5.0
        # Start on demand: docker compose --profile tools up -d kafka-ui
        env:
          KAFKA_CLUSTERS_0_NAME: "local"
          KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"
        labels:
          traefik.enable: "true"
          traefik.http.routers.homarr.entrypoints: websecure
          traefik.http.routers.homarr.rule: "Host(`kafka.{{ traefik_domain }}`)"
          traefik.http.services.homarr.loadbalancer.server.port: "8080"
          dockerdns.pihole.cname.domain: "kafka.{{ traefik_domain }}"
          dockerdns.pihole.cname.target: "{{ full_hostname }}"
