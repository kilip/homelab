---
- name: Ensure postgres installed and configured
  when: postgres
  block:
    - name: Ensure python postgres lib installed
      ansible.builtin.apt:
        name:
          - python3-psycopg2
          - python3-requests
          - libpq-dev
        state: present
      tags: always

    - name: Ensure postgres data dir exists
      ansible.builtin.file:
        path: "/srv/postgres/18"
        state: directory
        mode: "0755"

    - name: Ensure postgres container started
      community.docker.docker_container:
        name: postgres
        image: "{{ pg_image }}"
        image_name_mismatch: recreate
        state: started
        ports:
          - 5432:5432
        networks:
          - name: "{{ docker_network }}"
        volumes:
          - "/srv/postgres/18:/pgdata/18"
          - "/srv/postgres/17:/pgdata/17"
          - "/srv/postgres/backup:/pgdata/backup"
          - "/srv/postgres/certs:/certs"
        restart_policy: always
        command: >
          -c ssl=on
          -c ssl_cert_file=/certs/server.crt
          -c ssl_key_file=/certs/server.key
          -c ssl_ca_file=/certs/root.crt
        env:
          POSTGRES_USER: "{{ pg_user }}"
          POSTGRES_PASSWORD: "{{ pg_pass }}"
          POSTGRES_DB: "{{ pg_db }}"
          PGDATA: /pgdata/18

    - name: Ensure postgis extension installed
      community.postgresql.postgresql_ext:
        login_user: "{{ pg_user }}"
        login_password: "{{ pg_pass }}"
        login_host: "{{ ansible_host }}"
        login_db: "{{ pg_db }}"
        name: postgis
        state: present
